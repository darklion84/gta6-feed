name: feed

on:
  schedule:
    - cron: "17,47 * * * *"     # запасной ход: основной запуск раз в 10 минут делает воркер (worker/)
  workflow_dispatch:             # воркер, кнопка "Run workflow"
  push:                          # правки сайта выкладываются сразу
    branches: [main]
    paths: ["docs/**", ".github/workflows/feed.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Всегда берём свежую main, а не коммит, с которого запуск был поставлен в очередь:
      # пока запуск ждал своей очереди, предыдущий уже записал в репозиторий новую базу.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Собрать ленту
        run: python -m feed
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}

      - name: Сохранить базу и ленту в репозиторий
        id: save
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet -- docs/feed.json; then
            echo "feed_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "feed: update"
            git pull --rebase
            git push
          fi

      # Сайт перевыкладываем, только когда лента изменилась (или запуск ручной / после правки сайта)
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.save.outputs.feed_changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'schedule' || steps.save.outputs.feed_changed == 'true'
        with:
          path: docs
      - id: deploy
        if: github.event_name != 'schedule' || steps.save.outputs.feed_changed == 'true'
        uses: actions/deploy-pages@v4
