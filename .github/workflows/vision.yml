name: vision

# Проверка модели, которая смотрит кадры, на размеченных роликах (tools/vision_eval.py).
# Запускается только вручную, на ленту не влияет.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько роликов проверить (пусто: все)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/vision_eval.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_LIMIT: ${{ inputs.limit }}
