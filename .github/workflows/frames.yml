name: frames

# Разовый эксперимент для автомодерации: кадры уже решённых роликов (см. tools/frames.py).
# Запускается только вручную, на ленту не влияет.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/frames.py frames_out
      # Листы кладутся во временную ветку frames-tmp: её забирают для оценки и сразу удаляют.
      - name: Временная ветка с листами
        run: |
          cd frames_out
          git init -q -b frames-tmp
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "frames (temporary)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" frames-tmp
        env:
          GH_TOKEN: ${{ github.token }}
