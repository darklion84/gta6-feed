<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTA6 NEWS</title>
<meta name="description" content="The funniest GTA 6 clips from YouTube, TikTok and Instagram in one feed. Unofficial fan project.">
<meta name="theme-color" content="#0c0a12">
<!-- Превью при пересылке ссылки на сайт. Адрес прописан вручную: при смене домена обновить
     здесь и в config.py (SITE_URL), за совпадением следит тест. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="GTA6 NEWS">
<meta property="og:title" content="GTA6 NEWS: short GTA 6 clips in one feed">
<meta property="og:description" content="The funniest GTA 6 clips from YouTube, TikTok and Instagram. Unofficial fan project.">
<meta property="og:url" content="https://darklion84.github.io/gta6-feed/">
<meta property="og:image" content="https://darklion84.github.io/gta6-feed/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg: #0c0a12; --card: #17131f; --line: #2a2436;
    --text: #f3eef8; --dim: #9d93ad;
    --a1: #ff4f9a; --a2: #ff9a3d;
    --head: 52px;   /* шапка */
    --info: 72px;   /* подпись под плеером */
    /* плеер 9:16, вписанный в экран между шапкой и подписью */
    --pw: min(100vw, calc((100vh - var(--head) - var(--info) - 16px) * 9 / 16));
  }
  @supports (height: 100dvh) {
    :root { --pw: min(100vw, calc((100dvh - var(--head) - var(--info) - 16px) * 9 / 16)); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); }
  body { font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  header {
    position: fixed; top: 0; left: 0; right: 0; height: var(--head); z-index: 5;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: rgba(12, 10, 18, .94); border-bottom: 1px solid var(--line);
  }
  h1 {
    margin: 0; flex: none; font-size: 18px; font-weight: 800; letter-spacing: .02em;
    background: linear-gradient(90deg, var(--a1), var(--a2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--dim); font: inherit; font-size: 13px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tg {
    display: none; flex: none; padding: 6px 12px; border-radius: 999px;
    background: linear-gradient(90deg, var(--a1), var(--a2));
    color: #1a0f14; font-weight: 700; font-size: 13px; text-decoration: none;
  }

  /* Лента: один ролик на экран, прокрутка "прилипает" к роликам */
  #feed {
    position: fixed; top: var(--head); left: 0; right: 0; bottom: 0;
    overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  #feed::-webkit-scrollbar { display: none; }
  .slide {
    height: 100%; scroll-snap-align: start; scroll-snap-stop: always;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .player {
    position: relative; width: var(--pw); aspect-ratio: 9 / 16; flex: none;
    background: #000; border-radius: 14px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .player.ig { background: #fff; }
  .player.tg { background: #17212b; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .ph { color: #5d5470; font-size: 14px; text-align: center; padding: 0 20px; }
  .ph.off { color: var(--dim); display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .ph.off a, .ph.off button, #gate button {
    font: inherit; font-weight: 700; border-radius: 999px; padding: 11px 22px; cursor: pointer;
    text-decoration: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .ph.off a, #gate .yes {
    background: linear-gradient(90deg, var(--a1), var(--a2)); color: #1a0f14; border-color: transparent;
  }
  /* Экран согласия: пока зритель не разрешил, сторонние плееры не загружаются вовсе */
  #gate {
    position: fixed; top: var(--head); left: 0; right: 0; bottom: 0; z-index: 8;
    background: var(--bg); display: none; align-items: center; justify-content: center; padding: 24px;
  }
  #gate.on { display: flex; }
  #gate .box { max-width: 420px; text-align: center; }
  #gate h2 { margin: 0 0 12px; font-size: 22px; }
  #gate p { margin: 0 0 20px; color: var(--dim); font-size: 14px; line-height: 1.5; }
  #gate .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #gate .more { display: block; margin-top: 18px; color: var(--dim); font-size: 13px; }
  .about .legal { display: inline-block; margin-top: 14px; color: var(--dim); font-size: 13px; }

  .info {
    width: var(--pw); height: var(--info); flex: none; padding: 8px 12px 0;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .text { flex: 1; min-width: 0; }
  .title {
    margin: 0 0 3px; font-size: 14px; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere;
  }
  .meta { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta a { color: var(--a2); text-decoration: none; }
  .meta a + span::before, .meta span + span::before { content: " · "; color: var(--dim); }
  .nav { flex: none; display: flex; gap: 6px; }
  .nav button {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); padding: 0;
    background: var(--card); color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .nav button:disabled { opacity: .3; cursor: default; }
  .nav svg { width: 20px; height: 20px; display: block; }
  .nav .share { color: var(--a2); border-color: var(--a2); }
  .nav .share svg { width: 22px; height: 22px; }
  #toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 9;
    padding: 9px 16px; border-radius: 999px; background: var(--text); color: var(--bg);
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.on { opacity: 1; }

  .about { padding: 24px; text-align: center; color: var(--dim); font-size: 13px; }
  .about h2 { color: var(--text); font-size: 20px; margin: 0 0 8px; }
  .about p { max-width: 420px; margin: 0 auto 14px; }
  .about .tg { display: inline-block; font-size: 15px; padding: 10px 20px; }
  .about small { display: block; max-width: 420px; margin: 18px auto 0; color: #6f6680; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1 id="site-title">GTA6 NEWS</h1>
  <div class="chips" id="chips" role="group" aria-label="Filter by platform">
    <button class="chip" data-p="all" aria-pressed="true">All</button>
    <button class="chip" data-p="yt" aria-pressed="false">YouTube</button>
    <button class="chip" data-p="tt" aria-pressed="false">TikTok</button>
    <button class="chip" data-p="ig" aria-pressed="false">Instagram</button>
    <button class="chip" data-p="tg" aria-pressed="false">Telegram</button>
  </div>
  <a class="tg" id="tg" target="_blank" rel="noopener">Telegram</a>
</header>

<div id="toast" role="status" aria-live="polite"></div>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <div class="box">
    <h2 id="gate-title">Before you watch</h2>
    <p>Clips here are played by the official YouTube, TikTok, Instagram and Telegram players.
       When a player loads, that platform sets cookies and receives data such as your IP address.
       This site itself does not use tracking cookies.</p>
    <div class="row">
      <button type="button" class="yes" id="gate-yes">Watch clips</button>
      <button type="button" id="gate-no">Not now</button>
    </div>
    <a class="more" href="privacy.html">Privacy &amp; cookies</a>
  </div>
</div>
<main id="feed" tabindex="-1" aria-label="Clips feed">
  <noscript><p class="about">Please enable JavaScript to watch the feed.</p></noscript>
</main>

<script>
(function () {
  'use strict';
  // Ролик на экране запускается сам. Браузеры разрешают автозапуск только без
  // звука, поэтому YouTube стартует с выключенным звуком (включается касанием).
  // false = ничего не запускать, пока зритель сам не нажмёт play.
  var AUTOPLAY = true;
  // Когда ролик доиграл, лента сама переходит к следующему (YouTube и TikTok
  // сообщают о конце ролика; Instagram и Telegram нет, там ролик просто
  // останавливается). false = остановиться и ждать зрителя.
  var AUTONEXT = true;

  var NAMES = { yt: 'YouTube', tt: 'TikTok', ig: 'Instagram', tg: 'Telegram' };
  var all = [], filter = 'all', meta = {}, active = null;

  // Согласие на сторонние плееры. Плееры YouTube, TikTok, Instagram и Telegram
  // ставят свои cookie и получают IP зрителя, поэтому до явного согласия ни один
  // из них не загружается. Отказ тоже работает: вместо плеера показывается
  // ссылка на ролик на исходной площадке.
  var CONSENT_KEY = 'gta6feed.consent', consent = false;
  try { consent = localStorage.getItem(CONSENT_KEY) === '1'; } catch (e) { /* хранилище недоступно */ }
  var gate = document.getElementById('gate');
  function grantConsent() {
    consent = true;
    try { localStorage.setItem(CONSENT_KEY, '1'); } catch (e) { /* согласие действует до закрытия вкладки */ }
    gate.classList.remove('on');
    render();
  }
  document.getElementById('gate-yes').addEventListener('click', grantConsent);
  document.getElementById('gate-no').addEventListener('click', function () {
    try { sessionStorage.setItem(CONSENT_KEY, 'later'); } catch (e) { /* спросим снова */ }
    gate.classList.remove('on');
  });
  function askConsent() {
    var later = false;
    try { later = sessionStorage.getItem(CONSENT_KEY) === 'later'; } catch (e) { /* спросим */ }
    if (!consent && !later) gate.classList.add('on');
  }
  var feed = document.getElementById('feed');

  function embedUrl(it) {
    var id = encodeURIComponent(it.id);
    if (it.platform === 'yt') {
      return 'https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0&enablejsapi=1' +
             '&origin=' + encodeURIComponent(location.origin) +
             (AUTOPLAY ? '&autoplay=1&mute=1' : '');
    }
    if (it.platform === 'tt') {
      return 'https://www.tiktok.com/player/v1/' + id + '?rel=0&description=0&music_info=0' +
             (AUTOPLAY ? '&autoplay=1' : '');
    }
    if (it.platform === 'ig') return 'https://www.instagram.com/reel/' + id + '/embed/';
    // пост публичного Telegram-канала: id вида "channel/123"
    if (it.platform === 'tg' && /^[A-Za-z]\w{3,31}\/\d+$/.test(it.id)) return 'https://t.me/' + it.id + '?embed=1&dark=1';
    return null;
  }

  function fmtViews(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace('.0', '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace('.0', '') + 'K';
    return String(n);
  }

  function ago(iso) {
    var m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    if (m < 1440) return Math.round(m / 60) + ' h ago';
    return Math.round(m / 1440) + ' d ago';
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // Плеер есть только у ролика, который сейчас на экране: предыдущий сразу
  // перестаёт играть, а страница не держит десятки плееров одновременно.
  function mount(slide) {
    var box = slide.querySelector('.player');
    if (!consent || !box || box.querySelector('iframe')) return;
    var f = document.createElement('iframe');
    f.src = box.dataset.src;
    f.title = box.dataset.title || 'Video';
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen; web-share';
    f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.dataset.mounted = String(Date.now());
    box.appendChild(f);
    if (box.classList.contains('yt')) subscribeYouTube(f);
  }

  // Плеер YouTube начинает сообщать о своём состоянии только после "подписки".
  // Он может быть ещё не готов, поэтому повторяем её несколько секунд.
  function subscribeYouTube(frame) {
    var tries = 0;
    var timer = setInterval(function () {
      if (!frame.isConnected || frame.dataset.heard || ++tries > 20) { clearInterval(timer); return; }
      try {
        frame.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }),
                                        'https://www.youtube.com');
        frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'addEventListener',
                                                         args: ['onStateChange'], id: 1, channel: 'widget' }),
                                        'https://www.youtube.com');
      } catch (e) { /* плеер ещё грузится */ }
    }, 500);
  }

  // --- Сообщения от плееров -------------------------------------------------
  // Плеер YouTube и плеер TikTok рассказывают странице, что с ними происходит,
  // и принимают команды. Из этого складываются автопереход и "липкий" звук.

  // Разбор сообщения -> { state, muted, volume } (каждое поле может отсутствовать).
  // state: 1 играет, 2 пауза, 0 доиграл.
  function readPlayer(origin, raw) {
    var d = raw, out = {};
    if (typeof raw === 'string') { try { d = JSON.parse(raw); } catch (e) { return out; } }
    if (!d || typeof d !== 'object') return out;
    if (origin === 'https://www.youtube.com') {
      if (d.event === 'onStateChange' && typeof d.info === 'number') out.state = d.info;
      if ((d.event === 'infoDelivery' || d.event === 'initialDelivery') && d.info) {
        if (typeof d.info.playerState === 'number') out.state = d.info.playerState;
        if (typeof d.info.muted === 'boolean') out.muted = d.info.muted;
        if (typeof d.info.volume === 'number') out.volume = d.info.volume;
      }
    } else if (origin === 'https://www.tiktok.com' && d['x-tiktok-player'] === true) {
      if (d.type === 'onStateChange' && typeof d.value === 'number') out.state = d.value;
      // состояние звука запоминаем только по YouTube: там формат сообщений известен точно
    }
    return out;
  }

  function command(frame, func, arg) {
    try {
      if (frame.src.indexOf('https://www.youtube.com/') === 0) {
        frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func,
          args: arg === undefined ? [] : [arg], id: 1, channel: 'widget' }), 'https://www.youtube.com');
      } else if (frame.src.indexOf('https://www.tiktok.com/') === 0) {
        var type = { playVideo: 'play', setVolume: 'changeVolume' }[func] || func;   // mute / unMute совпадают
        frame.contentWindow.postMessage({ type: type, value: arg, 'x-tiktok-player': true }, 'https://www.tiktok.com');
      }
    } catch (e) { /* плеер уже убран */ }
  }

  // "Липкий" звук. Браузер разрешает автозапуск только без звука, поэтому каждый
  // ролик стартует беззвучно. Но если зритель один раз включил звук, страница
  // сама включает его у следующих роликов, пока он его не выключит.
  // Если браузер всё же не даёт включить звук без касания (так бывает на iPhone)
  // и ставит ролик на паузу, возвращаем беззвучный показ и больше не пробуем.
  var SOUND_KEY = 'gta6feed.sound', soundBlocked = false;
  var sound = { on: false, volume: null };
  try { sound.on = localStorage.getItem(SOUND_KEY) === '1'; } catch (e) { /* хранилище недоступно */ }
  function saveSound(on) {
    sound.on = on;
    try { localStorage.setItem(SOUND_KEY, on ? '1' : '0'); } catch (e) { /* не страшно */ }
  }

  function applySound(frame) {
    if (!sound.on || soundBlocked || frame.dataset.sound) return;
    frame.dataset.sound = 'trying';
    command(frame, 'unMute');
    if (sound.volume !== null) command(frame, 'setVolume', sound.volume);
    setTimeout(function () {
      if (!frame.isConnected || frame.dataset.state !== '2') { frame.dataset.sound = 'on'; return; }
      soundBlocked = true;                    // браузер поставил ролик на паузу вместо звука
      frame.dataset.sound = 'blocked';
      command(frame, 'mute');
      command(frame, 'playVideo');
    }, 1200);
  }

  window.addEventListener('message', function (e) {
    var frame = active && active.querySelector('iframe');
    if (!frame || e.source !== frame.contentWindow) return;   // слушаем только ролик на экране
    frame.dataset.heard = '1';
    var info = readPlayer(e.origin, e.data);

    if (info.state !== undefined) frame.dataset.state = String(info.state);
    if (info.volume !== undefined) sound.volume = info.volume;
    if (info.muted === false) {
      frame.dataset.unmuted = '1';
      if (!sound.on) saveSound(true);                          // зритель включил звук
    } else if (info.muted === true && frame.dataset.unmuted && frame.dataset.sound !== 'blocked') {
      saveSound(false);                                        // зритель сам его выключил
    }
    if (info.state === 1) {
      frame.dataset.played = '1';
      applySound(frame);                                       // ролик пошёл: включаем звук, если просили
    }

    // "Доиграл" засчитываем, только если ролик действительно шёл и не закончился
    // подозрительно быстро: плеер с ошибкой не должен гнать ленту дальше по цепочке.
    var alive = Date.now() - Number(frame.dataset.mounted || 0) > 3000;
    if (AUTONEXT && info.state === 0 && frame.dataset.played && alive && !frame.dataset.ended) {
      frame.dataset.ended = '1';
      go(active, 1);
    }
  });

  // Плеер ставится не мгновенно, а когда ролик продержался на экране почти
  // полсекунды: при быстром пролистывании ленты плееры пропущенных роликов не
  // грузятся вовсе. Лишние загрузки YouTube принимает за робота и начинает
  // требовать вход в аккаунт.
  var mountTimer = null;
  function mountSoon(slide) {
    clearTimeout(mountTimer);
    mountTimer = setTimeout(function () { if (slide === active) mount(slide); }, 400);
  }

  function unmount(slide) {
    var f = slide.querySelector('iframe');
    if (f) f.remove();
  }

  var watcher = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting || e.target === active) return;
      if (active) unmount(active);
      active = e.target;
      mountSoon(active);
      if (active.id) history.replaceState(null, '', '#' + active.id);
      remember(active);
      // у конца ленты (последний ролик или экран "всё просмотрено") следим за новинками
      var next = active.nextElementSibling;
      if (active.classList.contains('about') || (next && next.classList.contains('about'))) startPolling();
      else stopPolling();
    });
  }, { root: feed, threshold: 0.6 });

  function go(from, step) {
    var to = step > 0 ? from.nextElementSibling : from.previousElementSibling;
    if (to && to.classList.contains('slide')) to.scrollIntoView({ behavior: 'smooth' });
  }

  var toastTimer = null;
  function toast(text) {
    var t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 1800);
  }

  // Поделиться роликом: ссылка ведёт на его страницу с превью (название и кадр),
  // а та открывает ленту сразу на этом ролике.
  function share(it) {
    var url = new URL(it.page || ('#' + it.platform + '-' + it.id), document.baseURI).href;
    var title = it.title || document.title;
    // На телефоне открываем системное меню "Поделиться" (там есть и мессенджеры, и
    // "Скопировать"). На компьютере такое меню бесполезно, поэтому просто копируем ссылку.
    var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (touch && navigator.share) {
      navigator.share({ title: title, url: url }).catch(function () { /* закрыли окно: ничего страшного */ });
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { toast('Link copied'); },
                                              function () { toast(url); });
    } else {
      toast(url);
    }
  }

  // Значки нарисованы линиями, а не взяты из шрифта: символы-стрелки на разных
  // телефонах выглядят по-разному и на iPhone получались совсем мелкими.
  var SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
            'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var ICONS = {
    share: SVG + '<path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/><path d="M8 7l4-4 4 4"/><path d="M12 3v12"/></svg>',
    up: SVG + '<path d="M6 15l6-6 6 6"/></svg>',
    down: SVG + '<path d="M6 9l6 6 6-6"/></svg>'
  };
  function iconButton(name, cls) {
    var b = el('button', cls);
    b.type = 'button';
    b.innerHTML = ICONS[name];     // строки заданы выше, чужих данных в них нет
    return b;
  }

  function navButtons(slide, first, it) {
    var nav = el('div', 'nav');
    var send = iconButton('share', 'share');
    send.setAttribute('aria-label', 'Share this clip');
    send.addEventListener('click', function () { share(it); });
    nav.appendChild(send);
    var up = iconButton('up'), down = iconButton('down');
    up.setAttribute('aria-label', 'Previous clip');
    down.setAttribute('aria-label', 'Next clip');
    up.disabled = first;
    up.addEventListener('click', function () { go(slide, -1); });
    down.addEventListener('click', function () { go(slide, 1); });
    nav.appendChild(up); nav.appendChild(down);
    return nav;
  }

  function clipSlide(it, first) {
    var slide = el('section', 'slide');
    slide.id = it.platform + '-' + it.id;

    var box = el('div', 'player ' + it.platform);
    box.dataset.src = embedUrl(it);
    box.dataset.title = it.title || '';
    if (consent) {
      box.appendChild(el('div', 'ph', (NAMES[it.platform] || '') + ' · loading player…'));
    } else {
      // плееры выключены: даём ссылку на ролик на его площадке и кнопку "включить"
      var off = el('div', 'ph off');
      off.appendChild(el('div', null, 'Embedded players are off.'));
      if (typeof it.url === 'string' && it.url.indexOf('https://') === 0) {
        var out = el('a', null, 'Watch on ' + (NAMES[it.platform] || 'the source'));
        out.href = it.url; out.target = '_blank'; out.rel = 'noopener';
        off.appendChild(out);
      }
      var on = el('button', null, 'Turn on players');
      on.type = 'button';
      on.addEventListener('click', grantConsent);
      off.appendChild(on);
      box.appendChild(off);
    }
    slide.appendChild(box);

    var info = el('div', 'info');
    var text = el('div', 'text');
    text.appendChild(el('h2', 'title', it.title || 'GTA 6 clip'));
    var m = el('div', 'meta');
    if (typeof it.url === 'string' && it.url.indexOf('https://') === 0) {
      var a = el('a', null, NAMES[it.platform] || 'Source');
      a.href = it.url; a.target = '_blank'; a.rel = 'noopener';
      m.appendChild(a);
    }
    if (it.author) m.appendChild(el('span', null, it.author));
    if (it.views) m.appendChild(el('span', null, fmtViews(it.views) + ' views'));
    if (it.posted_at) m.appendChild(el('span', null, ago(it.posted_at)));
    text.appendChild(m);
    info.appendChild(text);
    info.appendChild(navButtons(slide, first, it));
    slide.appendChild(info);
    return slide;
  }

  function aboutSlide(empty) {
    var slide = el('section', 'slide about');
    slide.appendChild(el('h2', null, empty ? 'No clips yet' : "You're all caught up"));
    slide.appendChild(el('p', null, empty ? 'Check back soon.'
      : 'New clips will start playing here as soon as they are posted.'));
    if (meta.telegram) {
      var a = el('a', 'tg', 'New clips on Telegram');
      a.href = meta.telegram; a.target = '_blank'; a.rel = 'noopener';
      slide.appendChild(a);
    }
    slide.appendChild(el('small', null,
      'Unofficial fan project. Not affiliated with Rockstar Games or Take-Two Interactive. ' +
      "All clips belong to their creators and are played through the platforms' official embedded players."));
    var legal = el('a', 'legal', 'Privacy & cookies');
    legal.href = 'privacy.html';
    slide.appendChild(legal);
    return slide;
  }

  // Где зритель остановился в прошлый раз (в этом браузере). "end:ID" значит,
  // что он досмотрел ленту до конца и последним был ролик ID.
  var STORE_KEY = 'gta6feed.at';
  function recall() {
    try { return localStorage.getItem(STORE_KEY) || ''; } catch (e) { return ''; }
  }
  function remember(slide) {
    if (filter !== 'all') return;
    var value = slide.id;
    if (!value && slide.previousElementSibling) value = 'end:' + slide.previousElementSibling.id;
    try { if (value) localStorage.setItem(STORE_KEY, value); } catch (e) { /* хранилище недоступно */ }
  }

  // С какого ролика начать показ. Лента идёт от старых к новым, как переписка:
  // новые ролики добавляются снизу, а зритель продолжает с того места, где остановился.
  function startSlide(list) {
    var hash = decodeURIComponent(location.hash.slice(1));
    var byHash = hash && document.getElementById(hash);
    if (byHash && byHash.classList.contains('slide')) return byHash;      // пришли по ссылке на ролик
    var at = filter === 'all' ? recall() : '';
    if (at) {
      var done = at.indexOf('end:') === 0;
      var last = document.getElementById(done ? at.slice(4) : at);
      if (last) return done ? last.nextElementSibling : last;
    }
    // первый визит: с роликов за последние сутки, а если таких нет, с десяти последних
    var dayAgo = Date.now() - 24 * 3600 * 1000, idx = Math.max(0, list.length - 10);
    for (var i = 0; i < list.length; i++) {
      if (new Date(list[i].posted_at).getTime() >= dayAgo) { idx = i; break; }
    }
    return list.length ? document.getElementById(list[idx].platform + '-' + list[idx].id) : null;
  }

  function render() {
    watcher.disconnect();
    active = null;
    feed.textContent = '';
    var list = all.filter(function (it) { return filter === 'all' || it.platform === filter; });
    list.forEach(function (it, i) { feed.appendChild(clipSlide(it, i === 0)); });
    feed.appendChild(aboutSlide(list.length === 0));
    var start = startSlide(list);
    if (start) start.scrollIntoView(); else feed.scrollTop = 0;
    feed.querySelectorAll('.slide').forEach(function (s) { watcher.observe(s); });
  }

  function byTime(a, b) {
    return a.posted_at < b.posted_at ? -1 : a.posted_at > b.posted_at ? 1 : 0;
  }
  function usable(it) { return it && it.id && embedUrl(it); }

  // Зритель у конца ленты: каждые полминуты проверяем, не вышло ли новое.
  // Новые ролики встают в конец ленты, и показ продолжается сам.
  var POLL_MS = 30000, poll = null;
  function startPolling() { if (!poll) poll = setInterval(refresh, POLL_MS); }
  function stopPolling() { if (poll) { clearInterval(poll); poll = null; } }
  var refreshing = false;
  function refresh() {
    if (refreshing) return;       // две проверки разом добавили бы новинки дважды
    refreshing = true;
    fetch('feed.json?_=' + Date.now())
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        var known = {};
        all.forEach(function (it) { known[it.platform + '-' + it.id] = true; });
        var fresh = (data.items || []).filter(function (it) {
          return usable(it) && !known[it.platform + '-' + it.id];
        }).sort(byTime);
        if (!fresh.length) return;
        var wasEmpty = all.length === 0;
        all = all.concat(fresh);
        if (wasEmpty) { render(); return; }
        var end = feed.querySelector('.slide.about'), atEnd = active === end, firstNew = null;
        fresh.forEach(function (it) {
          if (filter !== 'all' && it.platform !== filter) return;
          var slide = clipSlide(it, false);
          feed.insertBefore(slide, end);
          watcher.observe(slide);
          firstNew = firstNew || slide;
        });
        // В фоновой вкладке плавная прокрутка не выполняется, поэтому там листаем сразу:
        // когда зритель вернётся, новый ролик уже будет на экране.
        if (firstNew && atEnd) firstNew.scrollIntoView({ behavior: document.hidden ? 'auto' : 'smooth' });
      })
      .catch(function () { /* нет сети: попробуем в следующий раз */ })
      .then(function () { refreshing = false; });
  }

  document.getElementById('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    filter = b.dataset.p;
    document.querySelectorAll('.chip').forEach(function (c) {
      c.setAttribute('aria-pressed', String(c === b));
    });
    history.replaceState(null, '', location.pathname + location.search);
    render();
  });

  // Зритель вернулся на вкладку (например, из Telegram): проверяем новинки сразу,
  // не дожидаясь очередной проверки по таймеру.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && all.length) refresh();
  });
  window.addEventListener('focus', function () { if (all.length) refresh(); });

  document.addEventListener('keydown', function (e) {
    if (!active || e.target.closest('button, a, input')) return;
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === 'j') { e.preventDefault(); go(active, 1); }
    if (e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'k') { e.preventDefault(); go(active, -1); }
  });

  fetch('feed.json?_=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      all = (data.items || []).filter(usable).sort(byTime);   // от старых к новым
      meta.tagline = data.tagline || '';
      if (data.title) {
        document.title = data.title;
        document.getElementById('site-title').textContent = data.title;
      }
      if (typeof data.telegram_url === 'string' && data.telegram_url.indexOf('https://t.me/') === 0) {
        meta.telegram = data.telegram_url;
        var tg = document.getElementById('tg');
        tg.href = data.telegram_url; tg.style.display = 'block';
      }
      render();
      askConsent();
    })
    .catch(function () {
      feed.textContent = '';
      feed.appendChild(el('section', 'slide about', 'Could not load the feed. Please refresh the page.'));
    });
})();
</script>
</body>
</html>
